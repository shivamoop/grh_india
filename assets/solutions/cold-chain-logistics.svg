<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 36" width="176" height="36" fill="none">
  <defs>
    <linearGradient id="logGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102a4d"/>
      <stop offset="100%" stop-color="#1a4578"/>
    </linearGradient>
  </defs>
  <!-- Emblem Badge -->
  <rect x="1" y="2" width="32" height="32" rx="7" fill="url(#logGrad)"/>
  <rect x="1" y="2" width="32" height="32" rx="7" stroke="#1eb8c9" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Snowflake & Temperature -->
  <line x1="17" y1="9" x2="17" y2="23" stroke="#1eb8c9" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="24" y2="16" stroke="#1eb8c9" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="12" y1="11" x2="22" y2="21" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="21" x2="22" y2="11" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <circle cx="17" cy="16" r="1.5" fill="#ffffff"/>
  <!-- 2-8°C Pill -->
  <rect x="8.5" y="24.5" width="17" height="6.5" rx="3" fill="#1eb8c9"/>
  <text x="17" y="29.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="5" font-weight="800" fill="#102a4d" text-anchor="middle">2°C-8°C</text>

  <!-- Typography -->
  <text x="40" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#102a4d" letter-spacing="0.6">COLD-CHAIN DISPATCH</text>
  <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0d7285" letter-spacing="0.3">24-48HR PAN-INDIA LOGISTICS</text>
</svg>
